<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="description" content="{{ site.description }}" />
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css" />
  </head>
  <body>
    <header class="header">
      <a class="logo" href="{{ site.baseurl }}/">Undefined Gallery</a>
      <nav class="nav">
        <a href="{{ site.baseurl }}/works/">Works</a>
        <a href="{{ site.baseurl }}/about/">About</a>
      </nav>
    </header>

    <main class="container">
      {{ content }}
    </main>

    <footer class="footer">
      <span>© {{ "now" | date: "%Y" }} Undefined Gallery</span>
    </footer>
  </body>
</html>
