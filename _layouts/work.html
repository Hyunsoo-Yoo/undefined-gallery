---
layout: default
---

<article class="work">
  <div class="work-hero">
    {% if page.image %}
      <img class="work-img" src="{{ page.image | relative_url }}" alt="{{ page.title }}" />
    {% endif %}
  </div>

  <h1 class="work-title">{{ page.title }}</h1>

  <div class="work-text">
    {{ content }}
  </div>

  <div class="work-meta">
      {% if page.designer %}<span>{{ page.designer }}</span>{% endif %}<br>
      {% if page.work_date %}<span>{{ page.work_date }}</span>{% endif %}
  </div>
  
  <div class="work-back">
    <a href="{{ site.baseurl }}/works/">← Back to Works</a>
  </div>
</article>
